name: Build RoadReady Punjabi Tablet Preview
on:
  push:
    branches:
      - roadready-punjabi-tablet-preview
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Show SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Build installable demo APK
        run: gradle -p RoadReadyPunjabiDemo --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RoadReadyPunjabi-preview-apk
          path: RoadReadyPunjabiDemo/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
