name: Test RoadReady Punjabi Tablet Preview On Emulator
on:
  push:
    branches:
      - roadready-punjabi-tablet-preview
  workflow_dispatch:
jobs:
  launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p RoadReadyPunjabiDemo --no-daemon assembleDebug
      - name: Launch in Android emulator and inspect
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_4
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r RoadReadyPunjabiDemo/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.roadready.punjabi.demo/.MainActivity
            sleep 10
            adb logcat -d -v brief > logcat.txt
            adb shell dumpsys activity activities > activities.txt
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml window.xml || true
            adb shell screencap -p /sdcard/roadready.png
            adb pull /sdcard/roadready.png screenshot.png
            grep -E 'FATAL EXCEPTION|com.roadready.punjabi.demo|chromium|crash' logcat.txt | tail -70 || true
            grep -E 'mResumed|topResumed' activities.txt | tail -10 || true
            test -s screenshot.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-emulator-diagnostics
          path: |
            screenshot.png
            logcat.txt
            activities.txt
            window.xml
          if-no-files-found: ignore
