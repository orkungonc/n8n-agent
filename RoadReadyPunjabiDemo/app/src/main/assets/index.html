let lang=localStorage.rrLang||"en",idx=0,selected=null,score=0,view="home",mode="practice";const el=document.getElementById("app");
function t(k){return copy[lang][k]||copy.en[k]}function show(v){view=v;render()}function chooseLanguage(l){lang=l;localStorage.rrLang=l;render()}function top(){return '<div class="hero"><div class="topline"><div class="logo">R·P</div><div><div class="brand">RoadReady Punjabi</div><div class="subtitle">'+t("subtitle")+'</div></div></div><h1>'+t("title")+'</h1><p>'+t("desc")+'</p><div class="motif"></div></div>'}
function langRow(){return '<div class="langs">'+["en","pa","roman"].map((l,i)=>'<button onclick="chooseLanguage(\''+l+'\')" class="'+(lang==l?'active':'')+'">'+["English","ਪੰਜਾਬੀ","Roman Punjabi"][i]+'</button>').join("")+'</div>'}
function render(){if(view==="home"){el.innerHTML=top()+'<div class="page">'+langRow()+'<div class="card"><div class="tag">TABLET PREVIEW · DEMO</div><h2 style="margin:12px 0">UK Theory Practice</h2><p class="muted">'+t("notice")+'</p><div class="statline"><div class="stat"><b>8</b><span>Demo questions</span></div><div class="stat"><b>3</b><span>Languages</span></div><div class="stat"><b>🔊</b><span>TTS & voice</span></div></div><button class="btn" onclick="start(\'practice\')">'+t("start")+'</button><button class="btn orange" onclick="start(\'mock\')">'+t("mock")+'</button></div><div class="section">'+t("topics")+'</div><div class="card"><span class="chip">Road signs</span><span class="chip">Speed</span><span class="chip">Hazards</span><span class="chip">Traffic lights</span><span class="chip">Priority</span></div><div class="card lock"><b>🔒 '+t("premium")+'</b><p class="muted">'+t("locked")+'</p></div><div class="warn">'+t("notice")+'</div><p class="little center">RoadReady Punjabi · Offline UI prototype</p></div>';return}
if(view==="quiz"){let q=bank[idx],arr=q[lang]||q.en,done=selected!==null;el.innerHTML='<div class="hero"><div class="nav"><b>RoadReady Punjabi</b><button class="audio" onclick="backToHome()">⌂ '+t("home")+'</button></div><h1>'+t("practice")+'</h1><div class="subtitle">'+t("question")+' '+(idx+1)+' / '+bank.length+' • '+q.topic+'</div><div class="progress"><div style="width:'+(100*(idx+1)/bank.length)+'%"></div></div></div><div class="page">'+langRow()+'<div class="card"><div class="nav"><span class="chip">'+q.topic+'</span><div><button class="audio" onclick="sayCurrent()">🔊 '+t("tts")+'</button></div></div><div class="qtext">'+arr[0]+'</div>'+arr.slice(1).map((o,i)=>'<button class="option '+(done?(i===q.correct?'good':i===selected?'bad':''):'')+'" onclick="answer('+i+')" '+(done?'disabled':'')+'><strong>'+String.fromCharCode(65+i)+'</strong><span>'+o+'</span></button>').join("")+'<button class="btn secondary" onclick="listen()">🎙 '+t("voice")+'</button>'+(done?'<div class="explain"><b>'+(selected===q.correct?'✓ '+t("correct"):'✕ '+t("wrong"))+'</b><br>'+t("explanation")+'<br>'+q.ex+'</div>':'')+'</div><div class="footer"><button class="btn ghost" onclick="backToHome()">'+t("home")+'</button>'+(done?'<button class="btn" onclick="next()">'+(idx===bank.length-1?t("finish"):t("next"))+'</button>':'')+'</div><p class="muted">'+t("voiceNote")+'</p></div>';return}
if(view==="results"){el.innerHTML=top()+'<div class="page"><div class="card center"><div class="chip">'+t("result")+'</div><div class="big">'+score+' / '+bank.length+'</div><p class="muted">'+Math.round(score/bank.length*100)+'% • Demo result only</p><button class="btn" onclick="start(\'practice\')">'+t("again")+'</button><button class="btn secondary" onclick="backToHome()">'+t("home")+'</button></div><div class="warn">'+t("notice")+'</div></div>';}}
function start(m){idx=0;score=0;selected=null;mode=m;show("quiz")}function answer(i){if(view!=="quiz"||selected!==null)return;selected=i;if(i===bank[idx].correct)score++;render()}function next(){if(idx<bank.length-1){idx++;selected=null;render()}else show("results")}function backToHome(){show("home")}function sayCurrent(){if(!window.Android)return;let q=bank[idx];let l=lang==="en"?"en":"pa";let v=lang==="en"?q.en[0]+" A "+q.en[1]+" B "+q.en[2]+" C "+q.en[3]+" D "+q.en[4]:q.pa[0]+" ਏ "+q.pa[1]+" ਬੀ "+q.pa[2]+" ਸੀ "+q.pa[3]+" ਡੀ "+q.pa[4];Android.say(v,l)}function listen(){if(window.Android)Android.listen();else alert(t("listenError"))}function voiceAnswer(v){let x=v.trim().toLowerCase();let lookup={"a":0,"ay":0,"hey":0,"one":0,"1":0,"b":1,"bee":1,"be":1,"two":1,"2":1,"c":2,"see":2,"sea":2,"three":2,"3":2,"d":3,"dee":3,"four":3,"4":3};if(lookup[x]!==undefined)answer(lookup[x]);else alert("Heard: "+v+"\nSay A, B, C or D")}function voiceUnavailable(){alert(t("listenError"))}render();
